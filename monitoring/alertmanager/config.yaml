global:
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'your-email@gmail.com'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email-notifications'

receivers:
- name: 'email-notifications'
  email_configs:
  - to: 'admin@yourcompany.com'
    headers:
      Subject: '[{{ .Status | toUpper }}] {{ .GroupLabels.alertname }}'
    html: |
      {{ if gt (len .Alerts.Firing) 0 }}
      <h3>🚨 FIRING ALERTS ({{ len .Alerts.Firing }}):</h3>
      <ul>
        {{ range .Alerts.Firing }}
        <li><b>{{ .Labels.alertname }}</b> on {{ if .Labels.instance }}{{ .Labels.instance }}{{ else }}unknown{{ end }}<br/>
            Summary: {{ if .Annotations.summary }}{{ .Annotations.summary }}{{ else }}No summary{{ end }}<br/>
            Started: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
        </li>
        {{ end }}
      </ul>
      {{ end }}

      {{ if gt (len .Alerts.Resolved) 0 }}
      <h3>✅ RESOLVED ALERTS ({{ len .Alerts.Resolved }}):</h3>
      <ul>
        {{ range .Alerts.Resolved }}
        <li><b>{{ .Labels.alertname }}</b> on {{ if .Labels.instance }}{{ .Labels.instance }}{{ else }}unknown{{ end }}<br/>
            Resolved: {{ .EndsAt.Format "2006-01-02 15:04:05" }}
        </li>
        {{ end }}
      </ul>
      {{ end }}
