apiVersion: v1
kind: Service
metadata:
  name: {{ include "payzee.fullname" . }}-api
  labels:
    {{- include "payzee.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "payzee.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - port: {{ .Values.api.port }}
      targetPort: {{ .Values.api.port }}
      protocol: TCP
