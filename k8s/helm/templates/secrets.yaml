apiVersion: v1
kind: Secret
metadata:
  name: {{ include "payzee.fullname" . }}-secrets
  labels:
    {{- include "payzee.labels" . | nindent 4 }}
type: Opaque
data:
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | b64enc | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | b64enc | quote }}
  SENTRY_DSN: {{ .Values.secrets.sentryDsn | b64enc | quote }}
  SENTRY_ENV: {{ .Values.secrets.sentryEnv | b64enc | quote }}
