networks:
  default:
    name: payzee
    driver: overlay
    # attachable: true

volumes:
  api_data:
  redis_data:
  redisinsight_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  uptime_kuma_data:
#   letsencrypt_data:

services:
  api:
    image: areebahmeddd/payzee:production
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_DB=${REDIS_DB}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - api_data:/app/data
    deploy:
      replicas: 2
    #   placement:
    #     constraints:
    #       - node.role == worker
    #     max_replicas_per_node: 1
      update_config:
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.api.rule=Host(`payzee-api.1mindlabs.org`)"
        - "traefik.http.routers.api.entrypoints=websecure"
        - "traefik.http.routers.api.tls.certresolver=letsencrypt"
        - "traefik.http.services.api.loadbalancer.server.port=8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
    #   placement:
    #     constraints:
    #       - node.role == worker
      update_config:
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  redisinsight:
    image: redis/redisinsight:latest
    volumes:
      - redisinsight_data:/db
    deploy:
      replicas: 1
    #   placement:
    #     constraints:
    #       - node.role == worker
      update_config:
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.1"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.redisinsight.rule=Host(`payzee-redisinsight.1mindlabs.org`)"
        - "traefik.http.routers.redisinsight.entrypoints=websecure"
        - "traefik.http.routers.redisinsight.tls.certresolver=letsencrypt"
        - "traefik.http.services.redisinsight.loadbalancer.server.port=5540"

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--log.level=warn"
    volumes:
      - ./monitoring/prometheus/config.yaml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yaml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    deploy:
      replicas: 1
    #   placement:
    #     constraints:
    #       - node.role == worker
      update_config:
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.prometheus.rule=Host(`payzee-prometheus.1mindlabs.org`)"
        - "traefik.http.routers.prometheus.entrypoints=websecure"
        - "traefik.http.routers.prometheus.tls.certresolver=letsencrypt"
        - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  alertmanager:
    image: prom/alertmanager:latest
    command:
      - "--config.file=/etc/alertmanager/config.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=warn"
    volumes:
      - ./monitoring/alertmanager/config.yaml:/etc/alertmanager/config.yml
      - alertmanager_data:/alertmanager
    deploy:
      replicas: 1
    #   placement:
    #     constraints:
    #       - node.role == worker
      update_config:
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.alertmanager.rule=Host(`payzee-alertmanager.1mindlabs.org`)"
        - "traefik.http.routers.alertmanager.entrypoints=websecure"
        - "traefik.http.routers.alertmanager.tls.certresolver=letsencrypt"
        - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=warn
    volumes:
      - ./monitoring/grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./monitoring/grafana/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./monitoring/grafana/api.json:/etc/grafana/provisioning/dashboards/api.json
      - grafana_data:/var/lib/grafana
    deploy:
      replicas: 1
    #   placement:
    #     constraints:
    #       - node.role == worker
      update_config:
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.25"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.grafana.rule=Host(`payzee-grafana.1mindlabs.org`)"
        - "traefik.http.routers.grafana.entrypoints=websecure"
        - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
        - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    volumes:
      - uptime_kuma_data:/app/data
    deploy:
      replicas: 1
    #   placement:
    #     constraints:
    #       - node.role == worker
      update_config:
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
        reservations:
          memory: 64M
          cpus: "0.1"
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.uptime-kuma.rule=Host(`payzee-uptime.1mindlabs.org`)"
        - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
        - "traefik.http.routers.uptime-kuma.tls.certresolver=letsencrypt"
        - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"

